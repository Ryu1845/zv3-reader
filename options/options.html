<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZV3 Reader options</title>
<link rel="stylesheet" href="../popup/popup.css">
<style>
  body { width: auto; max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 4px 0 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  input[type=text], input[type=url], textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  textarea { min-height: 110px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .card { margin: 10px 0; }
  label.radio { flex-direction: row; align-items: baseline; gap: 6px; font-size: 13px; color: var(--ink); margin: 4px 0; }
  p { margin: 4px 0 8px; }
</style>
<script type="module" src="options.js"></script>
</head>
<body>
<h1>ZV3 Reader options</h1>

<section class="card">
  <h2>Engine</h2>
  <label class="radio"><input type="radio" name="backend" value="local"> <span><b>Local</b>: generated on this computer
    with WebGPU (ZONOS3). Nothing is sent anywhere.</span></label>
  <label class="radio"><input type="radio" name="backend" value="server"> <span><b>Server</b>: generated by the ZONOS3
    server below (MLX, ggml or CUDA). The text read aloud is sent to it.</span></label>
  <div class="row"><button id="checkLocal">Check local engine</button><span class="small" id="localStatus"></span></div>
</section>

<section class="card">
  <h2>ZONOS3 server</h2>
  <p class="small">Used in server mode. Start one with ZONOS3's <code>servers/mlx/scripts/serve.sh</code> (Apple Silicon, port 1919).</p>
  <label>Server URL <input type="url" id="serverUrl" spellcheck="false"></label>
  <div class="row"><button id="testServer">Test connection</button><span class="small" id="serverStatus"></span></div>
</section>

<section class="card">
  <h2>Privacy</h2>
  <label>Never read on these sites (one hostname per line, <code>*</code> wildcards allowed)
    <textarea id="denylist" spellcheck="false"></textarea></label>
</section>

<section class="card">
  <h2>Learned speech rates</h2>
  <p class="small">Seconds of audio per character, per voice and language, used to size requests.</p>
  <div class="row"><button id="resetRates">Reset</button><span class="small" id="ratesInfo"></span></div>
</section>

<div class="row"><button id="save" class="primary">Save</button><span class="small" id="saveStatus"></span></div>
</body>
</html>
