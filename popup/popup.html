<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZV3 Reader</title>
<link rel="stylesheet" href="popup.css">
<script type="module" src="popup.js"></script>
</head>
<body>
<header>
  <h1>ZV3 Reader</h1>
  <span class="grow"></span>
  <a href="#" id="openOptions" title="Options">Options</a>
</header>

<section id="session" class="card" hidden>
  <div class="title" id="sTitle"></div>
  <div class="status"><span class="dot" id="sDot"></span><span id="sStatus"></span></div>
  <div class="row controls">
    <button id="back" title="Back 10 s">−10s</button>
    <button id="toggle" class="primary">Pause</button>
    <button id="fwd" title="Forward 10 s">+10s</button>
    <button id="stop" title="Stop">Stop</button>
  </div>
  <div class="row">
    <button id="saveSoFar" title="Join the parts generated so far into one WAV">Save audio so far</button>
    <button id="saveAll" title="Generate every remaining part (one at a time), then save one WAV">Generate all &amp; save</button>
  </div>
  <div class="small" id="exportStatus"></div>
  <div class="small warn" id="sNotice"></div>
</section>

<section class="card">
  <div class="row">
    <button id="readArticle" class="primary">Read article</button>
    <button id="readSelection">Read selection</button>
  </div>
  <div class="small err" id="startError"></div>
  <div class="row settings">
    <label>Speed
      <select id="speed"></select>
    </label>
    <label>Language
      <select id="lang"></select>
    </label>
    <label title="Local: generated on this computer with WebGPU; nothing is sent anywhere. Server: generated by the ZONOS3 server set in Options.">Engine
      <select id="engine"></select>
    </label>
  </div>
</section>

<section class="card voices">
  <div class="row"><b id="voiceHeading">Voice</b><span class="grow"></span><span class="small" id="voiceCurrent"></span></div>
  <input type="search" id="filter" placeholder="Search voices (name or group)">
  <div id="voiceList" class="list" role="listbox"></div>
  <div class="small" id="voiceStatus"></div>
  <audio id="preview" hidden></audio>
</section>

<footer class="small">
  <a href="#" id="shortcuts">Keyboard shortcuts</a> · <span id="server"></span>
</footer>
</body>
</html>
